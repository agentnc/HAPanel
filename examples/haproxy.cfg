# Example HAProxy configuration with HAPanel.
# Replace example.com / panel.example.com and the backends with your own.
# Requires HAProxy 3.1+ built with Lua (USE_LUA=1); tested on 3.2 LTS.

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    maxconn 100000

    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

    # HAPanel (page, live stream, login, settings)
    tune.lua.bool-sample-conversion normal
    lua-load /etc/haproxy/hapanel/hapanel.lua

    # TLS settings (Mozilla "intermediate" profile)
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ocsp-update.mode on

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 5s
    timeout queue 30s
    timeout tunnel 1h
    default-server inter 3s fall 3 rise 2 slowstart 30s maxconn 2000

frontend http
    bind :80
    bind [::]:80
    http-request redirect scheme https code 301

frontend https
    bind :443     ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    bind [::]:443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1

    # Optional: behind Cloudflare, trust its client-IP header only from Cloudflare addresses
    # (list from https://www.cloudflare.com/ips/ saved to /etc/haproxy/cloudflare-ips.lst)
    # http-request set-src req.hdr(CF-Connecting-IP) if { src -f /etc/haproxy/cloudflare-ips.lst } { req.hdr(CF-Connecting-IP) -m found }

    # Rate limiting per client IP (HAPanel's Security card reads the "denied" counter)
    stick-table type ipv6 size 1m expire 10m store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 200 }

    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains"
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-Frame-Options SAMEORIGIN
    http-request set-header X-Forwarded-Proto https

    filter compression
    compression algo gzip
    compression type text/html text/css text/plain application/javascript application/json image/svg+xml

    # ---- HAPanel at https://panel.example.com/hapanel/ ----
    acl host_panel  req.hdr(host),host_only -i panel.example.com
    acl path_panel  path /hapanel /hapanel/
    acl path_panel  path_beg /hapanel/
    # PWA files are public so phones can install the app
    acl pwa_asset   path /hapanel/manifest.webmanifest /hapanel/sw.js /hapanel/icon-192.png /hapanel/icon-512.png /hapanel/apple-touch-icon.png
    http-request redirect location /hapanel/ code 301 if host_panel { path /hapanel }
    http-request use-service lua.static if host_panel pwa_asset
    http-request use-service lua.login if host_panel { path /hapanel/login }
    # Everything else needs a valid session: the page redirects to the login, API calls get 401
    http-request set-var(txn.authed) lua.session_ok if host_panel path_panel
    acl authed var(txn.authed) -m str 1
    http-request redirect location /hapanel/login code 302 if host_panel { path /hapanel/ } !authed
    http-request return status 401 content-type application/json string '{"error":"signed out"}' hdr Cache-Control no-store if host_panel path_panel !authed
    http-request use-service lua.dashboard if host_panel { path /hapanel/ }
    http-request use-service lua.live if host_panel { path /hapanel/live }
    http-request use-service lua.settings if host_panel { path /hapanel/settings }
    http-request use-service lua.logout if host_panel { path /hapanel/logout }
    http-request use-service lua.password if host_panel { path /hapanel/password }
    http-request return status 204 hdr Cache-Control no-store if host_panel { path /hapanel/session }
    use_backend be_default if host_panel

    # ---- Your sites: one line per domain in hosts.map ("example.com be_web") ----
    use_backend %[req.hdr(host),host_only,lower,map_dom(/etc/haproxy/hosts.map,be_default)]

backend be_default
    http-request return status 404 content-type text/plain string "Unknown host\n"

backend be_web
    balance leastconn
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    server web1 10.0.0.11:3000 check
    server web2 10.0.0.12:3000 check

# Local stats + Prometheus metrics (optional, not used by HAPanel)
frontend stats_local
    bind 127.0.0.1:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
